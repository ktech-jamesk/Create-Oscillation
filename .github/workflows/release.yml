name: Release

# Pushing a tag like v1.0.0 builds the jar with that version, attaches it to a
# GitHub Release (notes from CHANGELOG.md), and commits the version bump back
# to main so gradle.properties always matches the latest tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " { printing = ($0 == "## " v) ; next }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION; using a default note" >&2
            echo "Release $VERSION" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release with the jar
        uses: softprops/action-gh-release@v2
        with:
          name: "Create: Oscillation ${{ github.ref_name }}"
          body_path: release-notes.md
          files: build/libs/createoscillation-*-${{ steps.version.outputs.version }}.jar

      - name: Commit the version bump to main
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git fetch origin main
          git checkout main
          if grep -q "^mod_version=$VERSION$" gradle.properties; then
            echo "gradle.properties already at $VERSION"
            exit 0
          fi
          sed -i "s/^mod_version=.*/mod_version=$VERSION/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump mod_version to $VERSION [skip ci]"
          git push origin main
